<div id="app"></div>
<script>
// ===== Tiny runtime: renders the Spark template ({{holes}}, sc-if, sc-for) and patches the page on every state change =====
(function(){
  const KEY = 'spark-app-state-v1';
  const TRANSIENT = {chatThinking:false, chatSync:false, toast:'', tour:null, paused:false};
  let app = null, root = null, queued = false, saveT = null;
  window.DCLogic = class { constructor(p){ this.props = p || {}; } setState(s){ this.state = Object.assign({}, this.state, s); schedule(); } forceUpdate(){ schedule(); } };
  function schedule(){ if (queued) return; queued = true; Promise.resolve().then(function(){ queued = false; render(); }); }
  const get = function(path, scope){ let o = scope; const ks = path.trim().split('.'); for (let k = 0; k < ks.length; k++){ if (o == null) return undefined; o = o[ks[k]]; } return o; };
  const hole = /\{\{\s*([^}]*?)\s*\}\}/g;
  const sub = function(str, scope){ return str.replace(hole, function(m, p){ if (/^(true|false)$/.test(p)) return p; const r = get(p, scope); return r == null ? '' : String(r); }); };
  function build(node, scope){
    const kids = Array.prototype.slice.call(node.childNodes);
    for (let n = 0; n < kids.length; n++){ const ch = kids[n];
      if (ch.nodeType === 3){ if (ch.nodeValue.indexOf('{{') >= 0) ch.nodeValue = sub(ch.nodeValue, scope); continue; }
      if (ch.nodeType !== 1){ ch.remove(); continue; }
      const tag = ch.tagName.toLowerCase();
      if (tag === 'sc-if'){ const ok = !!get(ch.getAttribute('value').replace(/[{}]/g, ''), scope); if (!ok){ ch.remove(); continue; } build(ch, scope); ch.replaceWith.apply(ch, Array.prototype.slice.call(ch.childNodes)); continue; }
      if (tag === 'sc-for'){ const list = get(ch.getAttribute('list').replace(/[{}]/g, ''), scope) || []; const as = ch.getAttribute('as'); const frag = document.createDocumentFragment();
        for (let i = 0; i < list.length; i++){ const cl = ch.cloneNode(true); const sc = Object.assign({}, scope); sc[as] = list[i]; build(cl, sc); while (cl.firstChild) frag.appendChild(cl.firstChild); }
        ch.replaceWith(frag); continue; }
      const attrs = Array.prototype.slice.call(ch.attributes);
      for (let a = 0; a < attrs.length; a++){ const at = attrs[a]; const nm = at.name;
        if (nm.indexOf('hint-') === 0){ ch.removeAttribute(nm); continue; }
        if (/^on[a-z]/i.test(nm) && at.value.indexOf('{{') >= 0){
          const fn = get(at.value.replace(/[{}]/g, ''), scope); ch.removeAttribute(nm);
          let ev = nm.slice(2).toLowerCase(); if (ev === 'change' && (tag === 'input' || tag === 'textarea')) ev = 'input';
          (ch.__on || (ch.__on = {}))[ev] = typeof fn === 'function' ? fn : null; continue; }
        if (at.value.indexOf('{{') >= 0) ch.setAttribute(nm, sub(at.value, scope));
      }
      build(ch, scope);
    }
  }
  const EVS = ['click','input','change','pointerdown','pointermove','pointerup','pointercancel'];
  function wire(el, on){ for (let i = 0; i < EVS.length; i++){ const e = EVS[i]; const fn = on && on[e]; el['on' + e] = fn ? function(ev){ fn(ev); } : null; } }
  function adopt(n){ if (n.nodeType === 1){ if (n.__on) wire(n, n.__on); if ((n.tagName === 'INPUT' || n.tagName === 'TEXTAREA') && n.hasAttribute('value')) n.value = n.getAttribute('value'); for (let c = n.firstChild; c; c = c.nextSibling) adopt(c); } return n; }
  function same(a, b){ return a.nodeType === b.nodeType && (a.nodeType !== 1 || a.tagName === b.tagName); }
  function patchEl(live, next){
    const la = live.attributes, na = next.attributes;
    for (let i = la.length - 1; i >= 0; i--){ const nm = la[i].name; if (!next.hasAttribute(nm)) live.removeAttribute(nm); }
    for (let i = 0; i < na.length; i++){ const nm = na[i].name, v = na[i].value; if (live.getAttribute(nm) !== v) live.setAttribute(nm, v); }
    if ((live.tagName === 'INPUT' || live.tagName === 'TEXTAREA') && next.hasAttribute('value')){ const v = next.getAttribute('value'); if (live.value !== v) live.value = v; }
    wire(live, next.__on);
    patchKids(live, next);
  }
  function patchKids(live, next){
    const a = Array.prototype.slice.call(live.childNodes), b = Array.prototype.slice.call(next.childNodes);
    for (let i = 0; i < b.length; i++){ const nb = b[i], lb = a[i];
      if (!lb){ live.appendChild(adopt(nb)); continue; }
      if (!same(lb, nb)){ live.replaceChild(adopt(nb), lb); continue; }
      if (nb.nodeType === 3 || nb.nodeType === 8){ if (lb.nodeValue !== nb.nodeValue) lb.nodeValue = nb.nodeValue; continue; }
      patchEl(lb, nb);
    }
    for (let i = b.length; i < a.length; i++) live.removeChild(a[i]);
  }
  function render(){
    const vals = app.renderVals();
    const frag = document.getElementById('tpl').content.cloneNode(true);
    build(frag, vals);
    patchKids(root, frag);
    save();
  }
  // ---- Saving: every change is written straight away to two places on the phone ----
  let db = null, last = '', wiping = false;
  function openDB(){ return new Promise(function(res){ try { const r = indexedDB.open('spark-app', 1); r.onupgradeneeded = function(){ r.result.createObjectStore('kv'); }; r.onsuccess = function(){ db = r.result; res(db); }; r.onerror = function(){ res(null); }; } catch (e) { res(null); } }); }
  function idbGet(){ return new Promise(function(res){ if (!db) return res(null); try { const q = db.transaction('kv').objectStore('kv').get(KEY); q.onsuccess = function(){ res(q.result || null); }; q.onerror = function(){ res(null); }; } catch (e) { res(null); } }); }
  function save(){
    if (!app || wiping) return; let json; try { json = JSON.stringify(app.state); } catch (e) { return; }
    if (json === last) return; last = json;
    try { localStorage.setItem(KEY, json); } catch (e) {}
    try { if (db) db.transaction('kv', 'readwrite').objectStore('kv').put(json, KEY); } catch (e) {}
  }
  function saveNow(){ last = ''; save(); }
  window.addEventListener('pagehide', saveNow);
  window.addEventListener('beforeunload', saveNow);
  document.addEventListener('freeze', saveNow);
  document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'hidden') saveNow(); });
  // ---- Hide the bottom bar while the keyboard is up ----
  const isField = function(el){ return el && (el.tagName === 'TEXTAREA' || (el.tagName === 'INPUT' && !/^(button|checkbox|radio|range|submit)$/i.test(el.type || ''))); };
  let kbT = null;
  document.addEventListener('focusin', function(e){ if (isField(e.target)) { clearTimeout(kbT); document.body.classList.add('kb'); } });
  document.addEventListener('focusout', function(){ clearTimeout(kbT); kbT = setTimeout(function(){ if (!isField(document.activeElement)) document.body.classList.remove('kb'); }, 120); });
  window.SparkStartAgain = function(){
    if (!confirm('Start again from scratch? This deletes your journal, memories and progress on this phone.')) return;
    wiping = true;
    try { localStorage.removeItem(KEY); } catch (e) {}
    const done = function(){ location.replace(location.pathname); };
    try { if (db) { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').delete(KEY); t.oncomplete = done; t.onerror = done; return; } } catch (e) {}
    done();
  };
  document.addEventListener('click', function(e){ const b = e.target.closest && e.target.closest('[data-action="start-again"]'); if (b) window.SparkStartAgain(); });
  window.SparkBoot = async function(Component){
    root = document.getElementById('app');
    await openDB();
    const reset = false;
    if (location.search) history.replaceState(null, '', location.pathname);
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
    app = new Component({start:'welcome'});
    let saved = null;
    if (!reset) {
      try { saved = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}
      if (!saved || !saved.screen) { try { saved = JSON.parse((await idbGet()) || 'null'); } catch (e) {} }
    }
    if (saved && saved.screen) app.state = Object.assign({}, app.state, saved, TRANSIENT);
    render();
    if (app.componentDidMount) app.componentDidMount();
  };
})();
</script>

  sgStart(st, cat, entryId, priv){
    // Pauses the coach and starts a safety check. Nothing else in the chat continues until the person says they're safe.
    const guess = st.sgCountry || guessCountry();
    const lead = {
      self:'I’ve read what you wrote, and I want to pause everything else for a moment. What you’re feeling matters, and you deserve support from a real person right now, not just me.',
      others:'I’ve read what you wrote, and it sounds like you’re having thoughts about hurting someone. That can be frightening to feel. Let’s pause everything else and get you proper support.',
      abuse:'I’ve read what you wrote, and it sounds like someone may be hurting you or making you feel unsafe. That’s not okay, and it’s not your fault. Let’s pause everything else and get you the right support.',
      crime:'I’ve read what you wrote, and it mentions something involving a crime. Let’s pause everything else for a moment so I can point you to the right people.'
    }[cat] + (priv ? ' Your entry stays private. I just want to check you’re okay.' : '');
    const ask = guess ? {spark:true, sg:true, text:'So I can show you the right numbers: it looks like you’re in ' + HELP[guess].name + '. Is that right?', replies:[['Yes, I’m in ' + HELP[guess].name, 'sgc:' + guess], ['No, I’m somewhere else', 'sgwhere']]}
                      : {spark:true, sg:true, text:'Where are you right now? Then I can show you the right people to contact.', replies: SG_ORDER.map(function(c){ return [HELP[c].label, 'sgc:' + c]; })};
    const talked = (st.chat || []).some(function(m){ return m.me; });
    return {sg:{cat:cat, id:entryId}, sgAt: Date.now(), chatMenu:false, chatThinking:false, chatSync:false, chat: (talked ? st.chat : []).concat([{spark:true, sg:true, text:lead, replies:[], src:'Your journal'}, ask]), convTurns:0};
  }

  say(kind, text){

    if (st.chatThinking) return;
    if (kind.indexOf('sg') === 0) {

      this.set(Object.assign({chat: st.chat.concat([{me:true, text:text}]), chatThinking:true, chatMenu:false}, r.patch || {})); this.scrollChat();
      clearTimeout(this.thinkTimer);
      this.thinkTimer = setTimeout(function(){ const cur = self.S(); self.set({chat: cur.chat.concat(r.msgs), chatThinking:false}); self.scrollChat(); }, 700);
      return;
    }
    if (st.sg && kind !== 'calm') return;
    if (kind === 'calm') return this.set({screen:'calm', back:'companion', calmFrom:'chat', chatMenu:false});
    const drafts = {journal:'This week has felt heavy because ', journalwin:'Today’s workout felt good because ', journalhard:'Today’s workout was hard because ', journalquit:'I stopped early today because '};
    if (drafts[kind]) return this.set({screen:'journal', back:'companion', composing:true, draft:drafts[kind], toast:'', chatMenu:false});
    if (kind === 'checkin') return this.set({screen:'checkin', back:'companion', checkStep:0, chatMenu:false});
    let step = st.startStep || 0;
    if (kind === 'step' || kind === 'trainers') step = Math.min(step + 1, 4);
    if (kind === 'restart') step = 0;
    const counts = Object.assign({}, st.askCount || {});
    const turns = kind === 'bye' ? 0 : (st.convTurns || 0) + 1;
    const answer = this.reply(kind, st.memoryOn, {step:step, n:counts[kind] || 0, planned: !!st.tomorrowPlanned || kind === 'planTomorrow', turns:turns, info:this.coachInfo(st), history: st.chat.filter(function(m){ return m.spark; }).map(function(m){ return m.text; }), label:text});
    counts[kind] = (counts[kind] || 0) + 1;
    const patch = {chat: st.chat.concat([{me:true,text:text}]), chatDraft:'', promptsMenu:false, chatMenu:false, chatThinking:true, startStep:step, askCount:counts, convTurns: kind === 'bye' ? 0 : turns};
    if (kind === 'planTomorrow') patch.tomorrowPlanned = true;
    const I0 = this.coachInfo(st);
    if ((kind === 'restok' || kind === 'injoff' || kind === 'illoff' || kind === 'lowrest') && I0.gym && !I0.trained) patch.dayOff = true;
    if (kind === 'injshort') patch.plan = 'short';

    if (kind === 'quitover' && st.memoryOn) patch.memories = st.memories.concat([{id:'m' + Date.now(), text:'Busy, loud sessions can get too much. A shorter, quieter version first helps.', src:'From a chat with Spark, today', on:true}]);

    if (act === 'openShort') return this.startEnv('short');
    if (act === 'openFull') return this.startEnv('usual');

      chatKey:function(e){ if (e.key === 'Enter') self.sendFree(); },
      sendChat:function(){ self.sendFree(); },
      chart:chart, showChart: !st.fresh, chartEmpty: !!st.fresh, chartEmptyText: firstLift ? 'First session logged: ' + EX[firstLift].name.toLowerCase() + ' at ' + fmt(st.hist[firstLift].kg) + ' ' + EX[firstLift].unit + '. Your chart grows from here.' : 'Your weights will show up here after your first workout.', pbEmpty: !pbList.length, showDemoWins: !st.fresh, freshWins: !!st.fresh, sessCount: st.sessCount || 0, jCount: (st.journal || []).length, monthCells:monthCells, monthCount:movedDays.length, monthCountLabel: movedDays.length === 1 ? '1 day moved' : movedDays.length + ' days moved', weekHeads:['M','T','W','T','F','S','S'], pbList:pbList, adaptTotal:st.adaptTotal,
      memView:memView, noMemories: st.memories.length === 0, memoryCount:memoryCount,
      memCls: st.memoryOn ? 'on' : '', toggleMemory:function(){ self.set({memoryOn:!self.S().memoryOn}); },
      memoryNote: st.memoryOn ? 'Spark uses these to personalise suggestions. Only you can see them.' : 'Memory is off. Spark won’t use or add anything until you turn it back on.',
      editDraft:st.editDraft, onEdit:function(e){ self.set({editDraft:e.target.value}); }, cancelEdit:function(){ self.set({editing:null}); },
      goBack:function(){ const cur = self.S(); self.set({screen: cur.back && cur.back !== cur.screen ? cur.back : 'today', back:'today'}); },
      reducedMotion:st.reducedMotion, rmCls: st.reducedMotion ? 'on' : '', toggleRM:function(){ self.set({reducedMotion:!self.S().reducedMotion}); },
      confirmWipe:st.confirmWipe, notConfirmWipe: !st.confirmWipe,
      askWipe:function(){ self.set({confirmWipe:true}); }, cancelWipe:function(){ self.set({confirmWipe:false}); },
      wipe:function(){ self.set({memories:[], confirmWipe:false}); },
      restart:function(){ self.set({screen:'welcome', onb:0}); }
    };
  }
}

SparkBoot(Component);
if ('serviceWorker' in navigator) window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js'); });
</script>
