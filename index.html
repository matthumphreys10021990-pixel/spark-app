.nv.on{background:#B7A6F6}
.nv-c{appearance:none;border:0;cursor:pointer;width:60px;height:60px;border-radius:50%;background:#111214;display:flex;align-items:center;justify-content:center;padding:0}
.stepper{display:flex;align-items:center;justify-content:space-between;background:#E7E7E0;border-radius:22px;padding:8px}
.stepper .v{font-family:'Inter',system-ui,sans-serif;font-weight:700;font-size:28px;letter-spacing:-0.02em;line-height:1;color:#111214}
.num{width:32px;height:32px;flex:none;border-radius:50%;background:#26272C;color:#F5F5F2;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px}
.line{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid #2A2B30}
.line:last-child{border-bottom:0}
.lline{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid #DCDCD5}
.lline:last-child{border-bottom:0}
.lline .num{background:#111214}
.toast{background:#DDF58B;color:#111214;border-radius:18px;padding:12px 16px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:10px}
.coach{background:#1C1D21;border-radius:24px;padding:16px;display:flex;gap:12px;align-items:flex-start}
.av{width:42px;height:42px;flex:none;border-radius:50%;background:#111214;box-shadow:inset 0 0 0 1.5px #34353B;display:flex;align-items:center;justify-content:center}
.bub{background:#1C1D21;border-radius:22px 22px 22px 6px;padding:14px 16px;font-size:16px;line-height:1.45}
.mine{align-self:flex-end;background:#DDF58B;color:#111214;border-radius:22px 22px 6px 22px;padding:12px 16px;font-size:15px;line-height:1.4;max-width:280px;font-weight:500}
@keyframes breathe{0%,100%{transform:scale(.72)}45%{transform:scale(1)}}
.breathe{animation:breathe 10s ease-in-out infinite}
@keyframes bwIn{0%,36%{opacity:1}46%,92%{opacity:0}100%{opacity:1}}
@keyframes bwOut{0%,40%{opacity:0}50%,88%{opacity:1}98%,100%{opacity:0}}
.bw{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center}
.bw-in{animation:bwIn 10s ease-in-out infinite}
.bw-out{animation:bwOut 10s ease-in-out infinite;opacity:0}
.bw-still{display:none}
.rm .bw-in,.rm .bw-out{display:none}.rm .bw-still{display:flex}
@media (prefers-reduced-motion: reduce){.bw-in,.bw-out{display:none}.bw-still{display:flex}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.rise{animation:rise .45s cubic-bezier(.2,.7,.2,1) both}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(221,245,139,.5)}50%{box-shadow:0 0 0 12px rgba(221,245,139,0)}}
.listening{animation:pulse 1.6s ease-in-out infinite;background:#DDF58B !important;color:#111214 !important}
.rm .breathe,.rm .rise,.rm .listening{animation:none}
.sync-orb{width:84px;height:84px;border-radius:50%;background:#1C1D21;display:flex;align-items:center;justify-content:center;animation:coachPulse 1.6s ease-out infinite}
@keyframes syncIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes tickOn{to{background:#DDF58B;color:#111214}}
.sync-item{opacity:0;animation:syncIn .3s ease forwards}
.sync-tick{width:22px;height:22px;flex:none;border-radius:50%;background:#26272C;color:transparent;display:flex;align-items:center;justify-content:center;animation:tickOn .25s ease forwards}
.rm .sync-orb{animation:none}.rm .sync-item{opacity:1;animation:none}.rm .sync-tick{animation:none;background:#DDF58B;color:#111214}
@keyframes thinkSpin{to{transform:rotate(360deg)}}
.think-spin{animation:thinkSpin .9s linear infinite;transform-origin:50% 50%}
.rm .think-spin{animation-duration:2.4s}
.tk-wrap{display:block;overflow:hidden;white-space:nowrap;container-type:inline-size}
.tk{display:inline-block;white-space:nowrap;animation:tkPan 9s ease-in-out infinite}
@keyframes tkPan{0%,18%{transform:translateX(0)}50%,68%{transform:translateX(min(0px,calc(100cqw - 100%)))}100%{transform:translateX(0)}}
.rm .tk{animation:none;max-width:100%;overflow:hidden;text-overflow:ellipsis}
@media (prefers-reduced-motion: reduce){.tk{animation:none;max-width:100%;overflow:hidden;text-overflow:ellipsis}}
.rm .btn,.rm .tile,.rm .itile{transition:none}
@keyframes coachPulse{0%{box-shadow:0 0 0 0 rgba(221,245,139,.38),0 0 0 0 rgba(183,166,246,.22)}60%{box-shadow:0 0 0 9px rgba(221,245,139,0),0 0 0 16px rgba(183,166,246,0)}100%{box-shadow:0 0 0 0 rgba(221,245,139,0),0 0 0 0 rgba(183,166,246,0)}}
@keyframes coachDisc{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.nv-c.pulse{position:relative;isolation:isolate;background:transparent}
.nv-c.pulse::before{content:'';position:absolute;inset:0;border-radius:50%;background:#111214;z-index:-1;animation:coachDisc 3.2s ease-in-out infinite,coachPulse 3.2s ease-out infinite}
.rm .nv-c.pulse::before{animation:none}
@media (prefers-reduced-motion: reduce){.nv-c.pulse::before{animation:none}}
@keyframes goGlow{0%,100%{box-shadow:0 0 0 0 rgba(221,245,139,.35)}50%{box-shadow:0 0 0 10px rgba(221,245,139,0)}}
.go-btn{animation:goGlow 2.8s ease-in-out infinite}
.rm .go-btn{animation:none}
@media (prefers-reduced-motion: reduce){.go-btn{animation:none}}
</style>

<style>
html,body{margin:0;height:100%;background:#111214;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;display:flex;justify-content:center;background:#111214;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);box-sizing:border-box}
#app > .sp{width:100%!important;max-width:520px;height:100%!important}
body.kb .nav{display:none!important}
</style>
</head>
<body>
<template id="tpl"><div class="sp {{rmClass}}" style="width: 412px; height: 100%; position: relative; overflow: hidden; background: #111214">

<!-- ================= WELCOME + ONBOARDING ================= -->
<sc-if value="{{is.welcome}}" hint-placeholder-val="{{ true }}">
<div class="scroll">
  <sc-if value="{{onb0}}" hint-placeholder-val="{{ true }}">
  <div style="height: 100%; position: relative; display: flex; flex-direction: column">
    <div class="hero-photo" role="img" aria-label="A woman lifting dumbbells in a dimly lit gym" style="flex: 1; display: flex; flex-direction: column; padding: 28px 24px; position: relative; overflow: hidden">
      <span aria-hidden="true" style="position: absolute; inset: 0; z-index: 0; overflow: hidden"><span class="hero-bg hero-img1"></span></span>
      <span style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(17,18,20,.45) 0%, rgba(17,18,20,.1) 20%, rgba(17,18,20,.28) 42%, rgba(17,18,20,.94) 100%)"></span>
      <span style="position: absolute; left: 0; right: 0; bottom: 0; height: 66%; background: radial-gradient(135% 90% at 0% 100%, rgba(17,18,20,.88) 0%, rgba(17,18,20,.58) 45%, rgba(17,18,20,0) 78%)"></span>
      <div class="row" style="justify-content: space-between; position: relative">
        <span></span>
        
      </div>
      <div style="flex: 1"></div>
      <img class="intro-up intro-1" src="img/logo.png" alt="Spark! logo" style="width: 120px; height: auto; position: relative; margin-bottom: 20px">
      <p class="brand-hero intro-up intro-2" style="font-size: 56px; line-height: .95; position: relative; letter-spacing: -0.03em; max-width: 100%; margin-bottom: 40px">FIND<br>YOUR<br>SPARK</p>
    </div>
    <div style="background: #111214; border-radius: 36px 36px 0 0; margin-top: -36px; position: relative; padding: 30px 24px 36px; display: flex; flex-direction: column; gap: 16px">
      <h1 class="d" style="font-size: 28px">Fitness that works with your brain, not against it.</h1>
      <div class="mut" style="margin: 0; font-size: 16px; line-height: 1.5"><p data-pm-slice="1 1 []">Help getting started, plus real-time support when things don't go to plan. No guilt or streaks to break.</p></div>
      <button class="btn b-lime full" style="margin-top: 6px" onClick="{{startSignup}}">Get started</button>
      <button class="link" style="align-self: center" onClick="{{startSignin}}">I already have an account</button>
    </div>
  </div>
  </sc-if>

  <!-- ---------- Setup steps ---------- -->
  <sc-if value="{{onbSetup}}" hint-placeholder-val="{{ false }}">
  <div class="rise" style="min-height: 100%; padding: 24px 22px 36px; display: flex; flex-direction: column; gap: 18px">
    <div class="row" style="justify-content: space-between">
      <button class="ib" aria-label="Back" onClick="{{onbBack}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
      <div class="row" style="gap: 4px; width: 200px" aria-label="Step {{onbPos}} of 8"><sc-for list="{{onbSegs}}" as="g" hint-placeholder-count="8"><span class="seg" style="{{g.st}}"></span></sc-for></div>
      <span class="mut" style="width: 44px; text-align: right; font-size: 13px">{{onbPos}}/8</span>
    </div>

    <!-- Name -->
    <sc-if value="{{onbName}}" hint-placeholder-val="{{ false }}">
      <h1 class="d" style="font-size: 36px; margin-top: 18px">What should we call you?</h1>
      <p class="mut" style="margin: 0; font-size: 16px; line-height: 1.5">Just your first name, or whatever you'd like Spark to call you.</p>
      <label for="sp-name" class="mut" style="font-size: 14px; margin-top: 8px">Your name</label>
      <input id="sp-name" class="field" style="font-size: 20px; padding: 16px 18px; margin-top: -10px" placeholder="Your name" value="{{nameDraft}}" onChange="{{onName}}" autocomplete="given-name">
      <sc-if value="{{nameMissing}}" hint-placeholder-val="{{ false }}"><p style="margin: -6px 0 0; font-size: 14px; color: #F4A29A">Add a name so Spark knows what to call you.</p></sc-if>
      <sc-if value="{{nameTyped}}" hint-placeholder-val="{{ false }}"><p class="mut" style="margin: 0; font-size: 14px">Spark will call you {{nameShown}}.</p></sc-if>
    </sc-if>

    <!-- Barriers -->
    <sc-if value="{{onbBarriers}}" hint-placeholder-val="{{ false }}">
      <h1 class="d" style="font-size: 36px; margin-top: 18px">What gets in the way of a workout?</h1>
      <p class="mut" style="margin: 0; font-size: 16px; line-height: 1.5">Pick as many as you like. Spark will help you work around them.</p>
      <div style="display: flex; flex-wrap: wrap; gap: 10px; margin-top: 6px">
        <sc-for list="{{barrierOpts}}" as="o" hint-placeholder-count="8"><button class="chip {{o.cls}}" style="min-height: 48px; font-size: 15px" aria-pressed="{{o.on}}" onClick="{{o.pick}}">{{o.label}}</button></sc-for>
      </div>
    </sc-if>

    <!-- Goals -->
    <sc-if value="{{onbGoals}}" hint-placeholder-val="{{ false }}">
      <h1 class="d" style="font-size: 36px; margin-top: 18px">What would you like from Spark?</h1>
      <p class="mut" style="margin: 0; font-size: 16px; line-height: 1.5">Pick up to three. There are no wrong answers.</p>
      <div style="display: flex; flex-wrap: wrap; gap: 10px; margin-top: 6px">
        <sc-for list="{{goalOpts}}" as="o" hint-placeholder-count="8"><button class="chip {{o.cls}}" style="min-height: 48px; font-size: 15px" aria-pressed="{{o.on}}" onClick="{{o.pick}}">{{o.label}}</button></sc-for>
      </div>
      <p class="mut" style="margin: 0; font-size: 14px">{{goalCount}} of 3 picked</p>
    </sc-if>

    <!-- Where + experience -->
    <sc-if value="{{onbWhere}}" hint-placeholder-val="{{ false }}">
      <h1 class="d" style="font-size: 36px; margin-top: 18px">Where will you usually train?</h1>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <sc-for list="{{whereOpts}}" as="o" hint-placeholder-count="4">
          <button aria-pressed="{{o.on}}" onClick="{{o.pick}}" style="appearance: none; cursor: pointer; font: inherit; border: 0; border-radius: 24px; padding: 16px; min-height: 104px; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; text-align: left; {{o.st}}">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{o.icon}}"></path></svg>
            <span style="font-weight: 600; font-size: 16px">{{o.label}}</span>
          </button>
        </sc-for>
      </div>
      <h2 class="d" style="font-size: 22px; margin-top: 10px">How familiar are you with workouts?</h2>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <sc-for list="{{expOpts}}" as="o" hint-placeholder-count="3">
          <button aria-pressed="{{o.on}}" onClick="{{o.pick}}" style="appearance: none; cursor: pointer; font: inherit; text-align: left; border: 0; border-radius: 20px; padding: 14px 16px; {{o.st}}"><span style="display: block; font-weight: 600; font-size: 16px">{{o.label}}</span><span style="font-size: 14px; opacity: .75">{{o.sub}}</span></button>
        </sc-for>
      </div>
    </sc-if>

    <!-- Schedule -->
    <sc-if value="{{onbSchedule}}" hint-placeholder-val="{{ false }}">
      <h1 class="d" style="font-size: 34px; margin-top: 18px">When would you like to train?</h1>
      <p class="mut" style="margin: 0; font-size: 16px; line-height: 1.5">Pick the days you'd like to aim for. Plans can always move.</p>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px" role="group" aria-label="Training days">
        <sc-for list="{{dayOpts}}" as="o" hint-placeholder-count="7">
          <button aria-pressed="{{o.on}}" aria-label="{{o.full}}" onClick="{{o.pick}}" style="appearance: none; cursor: pointer; font: inherit; border-radius: 50%; width: 46px; height: 46px; margin: 0 auto; font-weight: 600; font-size: 15px; display: flex; align-items: center; justify-content: center; {{o.st}}">{{o.short}}</button>
        </sc-for>
      </div>
      <h2 class="d" style="font-size: 20px; margin-top: 6px">What times usually suit you?</h2>
      <p class="mut" style="margin: -10px 0 0; font-size: 14px">Pick any that work.</p>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <sc-for list="{{timeOpts}}" as="o" hint-placeholder-count="6"><button class="chip {{o.cls}}" aria-pressed="{{o.on}}" onClick="{{o.pick}}" style="flex-direction: column; align-items: flex-start; gap: 0; min-height: 56px; padding: 6px 16px; border-radius: 18px"><span style="font-weight: 600">{{o.label}}</span><span style="font-size: 12px; opacity: .7">{{o.range}}</span></button></sc-for>
        <button class="chip {{flexCls}}" aria-pressed="{{flexOn}}" onClick="{{pickFlex}}" style="flex-direction: column; align-items: flex-start; gap: 0; min-height: 56px; padding: 6px 16px; border-radius: 18px"><span style="font-weight: 600">I'm flexible</span><span style="font-size: 12px; opacity: .7">Whenever suits</span></button>
      </div>
      <h2 class="d" style="font-size: 20px; margin-top: 6px">How long, usually?</h2>
      <div style="display: flex; gap: 8px">
        <sc-for list="{{lenOpts}}" as="o" hint-placeholder-count="4"><button class="chip {{o.cls}}" aria-pressed="{{o.on}}" onClick="{{o.pick}}" style="flex: 1; justify-content: center">{{o.label}}</button></sc-for>
      </div>
      <div class="coach">
        <span class="av" style="width: 36px; height: 36px"><img src="img/logo.png" alt="" style="width: 22px; height: auto"></span>
        <span style="font-size: 15px; line-height: 1.45">{{scheduleNote}}</span>
      </div>
    </sc-if>

    <!-- Focus per day -->
    <sc-if value="{{onbFocus}}" hint-placeholder-val="{{ false }}">
      <h1 class="d" style="font-size: 34px; margin-top: 18px">What's each day for?</h1>
      <p class="mut" style="margin: 0; font-size: 16px; line-height: 1.5">Same plan every week, so there's nothing to decide on the day. Here's a starting split. Tap a day to change it.</p>
      <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 4px">
        <sc-for list="{{focusRows}}" as="r" hint-placeholder-count="3">
          <button aria-label="{{r.aria}}" onClick="{{r.open}}" style="appearance: none; cursor: pointer; font: inherit; text-align: left; border: 0; border-radius: 22px; padding: 14px 16px; background: #1C1D21; color: #F5F5F2; display: flex; align-items: center; gap: 14px">
            <span style="flex: none; width: 46px; height: 46px; border-radius: 50%; background: #DDF58B; color: #111214; font-weight: 600; font-size: 15px; display: flex; align-items: center; justify-content: center">{{r.short}}</span>
            <span style="flex: 1; min-width: 0"><span class="mut" style="display: block; font-size: 13px">{{r.day}}</span><span style="display: block; font-weight: 600; font-size: 17px">{{r.focus}}</span></span>
            <span class="mut" style="font-size: 14px">Change</span>
          </button>
        </sc-for>
      </div>
      <div class="coach">
        <span class="av" style="width: 36px; height: 36px"><img src="img/logo.png" alt="" style="width: 22px; height: auto"></span>
        <span style="font-size: 15px; line-height: 1.45">I'll remember this as your routine. You can change any day later in Your week.</span>
      </div>
    </sc-if>

    <!-- Reminders -->
    <sc-if value="{{onbRemind}}" hint-placeholder-val="{{ false }}">
      <h1 class="d" style="font-size: 36px; margin-top: 18px">Want a nudge before each session?</h1>
      <p class="mut" style="margin: 0; font-size: 16px; line-height: 1.5">One gentle reminder at most. Never about any missed days.</p>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <sc-for list="{{remindOpts}}" as="o" hint-placeholder-count="4">
          <button aria-pressed="{{o.on}}" onClick="{{o.pick}}" style="appearance: none; cursor: pointer; font: inherit; text-align: left; border: 0; border-radius: 20px; padding: 16px; display: flex; align-items: center; gap: 12px; {{o.st}}"><span style="flex: 1"><span style="display: block; font-weight: 600; font-size: 16px">{{o.label}}</span><span style="font-size: 14px; opacity: .75">{{o.sub}}</span></span></button>
        </sc-for>
      </div>
      <div style="background: #F5F5F2; color: #111214; border-radius: 22px; padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start">
        <img src="img/logo.png" alt="" style="width: 26px; height: auto; margin-top: 2px">
        <span><span style="display: block; font-weight: 600; font-size: 14px">Preview</span><span style="font-size: 14px; line-height: 1.4">{{remindPreview}}</span></span>
      </div>
    </sc-if>

    <!-- Memory consent -->
    <sc-if value="{{onbMemory}}" hint-placeholder-val="{{ false }}">
      <h1 class="d" style="font-size: 36px; margin-top: 18px">Can Spark remember things to help you?</h1>
      <p class="mut" style="margin: 0; font-size: 16px; line-height: 1.5">Like which times feel easiest, or what helped on a hard day. It makes suggestions more personal.</p>
      <div class="card" style="display: flex; flex-direction: column; gap: 12px; padding: 18px">
        <div class="row" style="align-items: flex-start"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#DDF58B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 2px"><path d="M5 12l5 5 9-10"></path></svg><span style="font-size: 15px">You can read every memory</span></div>
        <div class="row" style="align-items: flex-start"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#DDF58B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 2px"><path d="M5 12l5 5 9-10"></path></svg><span style="font-size: 15px">Edit or delete any of them, any time</span></div>
        <div class="row" style="align-items: flex-start"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#DDF58B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 2px"><path d="M5 12l5 5 9-10"></path></svg><span style="font-size: 15px">Your journal is never shared with anyone</span></div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <sc-for list="{{memOpts}}" as="o" hint-placeholder-count="2">
          <button aria-pressed="{{o.on}}" onClick="{{o.pick}}" style="appearance: none; cursor: pointer; font: inherit; text-align: left; border: 0; border-radius: 20px; padding: 16px; {{o.st}}"><span style="display: block; font-weight: 600; font-size: 16px">{{o.label}}</span><span style="font-size: 14px; opacity: .75">{{o.sub}}</span></button>
        </sc-for>
      </div>
    </sc-if>

    <div style="flex: 1"></div>
    <button class="btn b-lime full" onClick="{{onbNext}}">{{onbCta}}</button>
  </div>
  </sc-if>

  <!-- ---------- All set ---------- -->
  <sc-if value="{{onbDone}}" hint-placeholder-val="{{ false }}">
  <div class="rise" style="min-height: 100%; padding: 24px 22px 36px; display: flex; flex-direction: column; gap: 18px">
    <div class="row" style="justify-content: space-between">
      <button class="ib" aria-label="Back" onClick="{{onbBack}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
    </div>
    <img src="img/logo.png" alt="" style="width: 84px; height: auto; margin-top: 18px">
    <h1 class="d" style="font-size: 38px">{{allSetTitle}}</h1>
    <p class="mut" style="margin: 0; font-size: 16px; line-height: 1.5">Thank you for setting things up. Spark is now built around you, and you can change any of it later. Next, a quick look at how everything works.</p>
    <div style="position: relative; overflow: hidden; background: #DDF58B; color: #111214; border-radius: 28px; padding: 6px 20px">
      <sc-for list="{{summaryRows}}" as="r" hint-placeholder-count="5">
        <div class="row" style="justify-content: space-between; padding: 14px 0; border-bottom: 1px solid rgba(17,18,20,.12); gap: 16px"><span style="font-size: 14px; font-weight: 500; opacity: .7">{{r.k}}</span><span style="font-size: 15px; font-weight: 600; text-align: right">{{r.v}}</span></div>
      </sc-for>
    </div>
    <div style="flex: 1"></div>
    <button class="btn b-lime full" style="min-height: 60px; font-size: 17px" onClick="{{finishOnb}}">Show me around</button>
  </div>
  </sc-if>
</div>
</sc-if>

<!-- ================= TODAY ================= -->
<sc-if value="{{is.today}}" hint-placeholder-val="{{ false }}">
<div class="scroll" style="padding: 22px 0 124px">
  <div class="row" style="justify-content: space-between; padding: 0 20px">
    <div class="row" style="gap: 12px">
      <button class="ib" aria-label="Profile and settings" onClick="{{nav.settings}}" style="width: 48px; height: 48px; background: #B7A6F6; color: #111214; font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 18px">{{userInitial}}</button>
      <span><span class="d" style="font-size: 22px; display: block">Hi {{userName}}</span><span class="mut" style="font-size: 14px">Sunday, 11 October</span></span>
    </div>
  </div>

  <div style="padding: 0 20px; margin-top: 24px">
    <div class="row" style="justify-content: space-between; align-items: center">
      <span style="flex: 1; min-width: 0"><span style="display: block; font-size: 14px; font-weight: 600; color: #B7A6F6">{{weekTitle}}</span><span class="mut tk-wrap" style="font-size: 13px" title="{{weekSummary}}"><span class="tk">{{weekSummary}}</span></span></span>
      <span class="row" style="gap: 6px">
        <button class="ib" style="width: 38px; height: 38px; {{weekPrevSt}}" aria-label="This week" onClick="{{weekPrev}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
        <button class="ib" style="width: 38px; height: 38px; {{weekNextSt}}" aria-label="Next week" onClick="{{weekNext}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></button>
        <button class="chip {{weekEditCls}}" style="min-height: 38px; padding: 0 16px; font-size: 13px" aria-pressed="{{weekEditing}}" onClick="{{toggleWeekEdit}}">{{weekEditLabel}}</button>
      </span>
    </div>
  </div>
  <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; padding: 0 14px; margin-top: 14px">
    <sc-for list="{{weekDots}}" as="d" hint-placeholder-count="7">
      <button onClick="{{d.toggle}}" aria-label="{{d.btnLabel}}" style="appearance: none; border: 0; background: transparent; color: inherit; font: inherit; padding: 0; cursor: {{d.cursor}}; display: flex; flex-direction: column; align-items: center; gap: 8px">
        <span class="mut" style="font-size: 13px">{{d.d}}</span>
        <span style="width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 15px; box-sizing: border-box; {{d.st}}">{{d.n}}</span>
        <sc-if value="{{weekEditing}}" hint-placeholder-val="{{ false }}"><span style="height: 12px; font-size: 11px; font-weight: 600; line-height: 12px; {{d.tagSt}}">{{d.tag}}</span></sc-if>
        <sc-if value="{{weekNotEditing}}" hint-placeholder-val="{{ true }}">
        <span style="height: 12px; display: flex; align-items: center; justify-content: center" aria-label="{{d.aria}}" role="img">
          <sc-if value="{{d.isDone}}" hint-placeholder-val="{{ false }}"><svg width="13" height="12" viewBox="0 0 13 12" aria-hidden="true"><path d="M1.5 6.5l3.2 3.2L11.5 2" fill="none" stroke="#DDF58B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg></sc-if>
          <sc-if value="{{d.isPlanned}}" hint-placeholder-val="{{ false }}"><span style="width: 7px; height: 7px; border-radius: 50%; background: #B7A6F6"></span></sc-if>
          <sc-if value="{{d.isRested}}" hint-placeholder-val="{{ false }}"><span style="width: 10px; height: 2.5px; border-radius: 999px; background: #71717A"></span></sc-if>
        </span>
        </sc-if>
      </button>
    </sc-for>
  </div>
  <sc-if value="{{weekEditing}}" hint-placeholder-val="{{ false }}">
    <p class="mut" style="margin: 12px 20px 0; font-size: 13px; text-align: center">Tap a day to set it as a workout or rest, and pick its focus.</p>
  </sc-if>

  <!-- ---------- Training day ---------- -->
  <sc-if value="{{todayTrain}}" hint-placeholder-val="{{ true }}">
  <div style="padding: 0 20px; margin-top: 30px; display: flex; flex-direction: column; gap: 14px">
    <div class="row" style="gap: 12px; align-items: flex-start; padding: 0 2px">
      <span class="av" style="width: 38px; height: 38px"><img src="img/logo.png" alt="" style="width: 23px; height: auto"></span>
      <span style="flex: 1; font-size: 16px; line-height: 1.45; padding-top: 2px">{{todayBubble}}</span>
    </div>

    <section aria-label="Today's workout" style="position: relative; overflow: hidden; isolation: isolate; background: #1C1D21; border-radius: 34px; padding: 24px 18px 18px; display: flex; flex-direction: column">
      <svg class="rings" viewBox="0 0 200 200" width="300" height="300" aria-hidden="true" style="right: -110px; top: -120px; z-index: -1"><g fill="none" stroke="#DDF58B" stroke-opacity=".08" stroke-width="10"><circle cx="100" cy="100" r="30"></circle><circle cx="100" cy="100" r="55"></circle><circle cx="100" cy="100" r="80"></circle></g></svg>
      <span style="font-size: 14px; font-weight: 600; color: #B7A6F6; padding: 0 4px">Today's workout</span>
      <h2 class="d" style="font-size: 36px; margin-top: 8px; padding: 0 4px">{{plan.title}}</h2>
      <span class="mut" style="font-size: 15px; margin-top: 8px; padding: 0 4px">{{todayMeta}}</span>
      <button class="btn b-lime full go-btn" style="margin-top: 26px; min-height: 92px; border-radius: 999px; padding: 0 12px 0 12px; justify-content: flex-start; gap: 18px" onClick="{{startWorkout}}">
        <span style="width: 68px; height: 68px; flex: none; border-radius: 50%; background: #111214; color: #DDF58B; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z" fill="currentColor"></path></svg></span>
        <span class="d" style="font-size: 26px">Start workout</span>
      </button>
    </section>

    <button onClick="{{nav.checkin}}" aria-label="{{checkRow.aria}}" style="appearance: none; cursor: pointer; font: inherit; text-align: left; border: 0; border-radius: 24px; background: transparent; color: #F5F5F2; box-shadow: inset 0 0 0 1.5px #2A2B30; padding: 14px 16px; display: flex; align-items: center; gap: 14px">
      <span style="width: 38px; height: 38px; flex: none; border-radius: 50%; display: flex; align-items: center; justify-content: center; {{checkRow.icSt}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{checkRow.ic}}"></path></svg></span>
      <span style="flex: 1; min-width: 0"><span style="display: block; font-weight: 600; font-size: 15px">{{checkRow.title}}</span><span class="mut" style="display: block; font-size: 13px; margin-top: 2px">{{checkRow.sub}}</span></span>
      <span style="font-size: 14px; font-weight: 600; color: #B7A6F6">{{checkRow.cta}}</span>
    </button>
    <button class="link" style="align-self: center" onClick="{{notToday}}">Not today</button>
  </div>
  </sc-if>

  <!-- ---------- Rest day ---------- -->
  <sc-if value="{{todayRest}}" hint-placeholder-val="{{ false }}">
  <div style="padding: 0 20px; margin-top: 30px; display: flex; flex-direction: column; gap: 14px">
    <div class="row" style="gap: 12px; align-items: flex-start; padding: 0 2px">
      <span class="av" style="width: 38px; height: 38px"><img src="img/logo.png" alt="" style="width: 23px; height: auto"></span>
      <span style="flex: 1; font-size: 16px; line-height: 1.45; padding-top: 2px">{{todayBubble}}</span>
    </div>
    <section style="position: relative; overflow: hidden; isolation: isolate; background: #A6D8FA; color: #111214; border-radius: 30px; padding: 22px">
      <svg class="rings" viewBox="0 0 200 200" width="240" height="240" aria-hidden="true" style="right: -80px; top: -70px; z-index: -1"><g fill="none" stroke="#111214" stroke-opacity=".07" stroke-width="10"><circle cx="100" cy="100" r="30"></circle><circle cx="100" cy="100" r="55"></circle><circle cx="100" cy="100" r="80"></circle></g></svg>
      <span style="font-size: 14px; font-weight: 600">Rest day</span>
      <h2 class="d" style="font-size: 30px; margin-top: 6px">Recovery is part of the plan.</h2>
      <p style="margin: 8px 0 0; font-size: 15px; line-height: 1.45">Your muscles rebuild on days like this. Everything below is optional.</p>
    </section>
    <div class="row" style="justify-content: space-between; margin-top: 6px; padding: 0 2px"><h3 class="d" style="font-size: 20px">If you fancy it</h3><span class="mut" style="font-size: 13px">No pressure</span></div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <sc-for list="{{restTiles}}" as="r" hint-placeholder-count="4">
        <button onClick="{{r.go}}" style="appearance: none; cursor: pointer; font: inherit; text-align: left; border: 0; border-radius: 24px; background: #1C1D21; color: #F5F5F2; padding: 16px; min-height: 128px; display: flex; flex-direction: column; justify-content: space-between; gap: 14px">
          <span style="width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #111214; {{r.icSt}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.ic}}"></path></svg></span>
          <span><span style="display: block; font-weight: 600; font-size: 16px">{{r.title}}</span><span class="mut" style="display: block; font-size: 13px; margin-top: 2px">{{r.sub}}</span></span>
        </button>
      </sc-for>
    </div>
    <div class="card" style="display: flex; gap: 14px; align-items: flex-start; padding: 18px">
      <span style="width: 40px; height: 40px; flex: none; border-radius: 50%; background: #26272C; color: #DDF58B; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V17h5v-1.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"></path></svg></span>
      <span style="flex: 1"><span style="display: block; font-size: 13px; font-weight: 600; color: #B7A6F6">{{tip.kind}}</span><span style="display: block; font-size: 15px; line-height: 1.45; margin-top: 4px">{{tip.text}}</span><button class="link" style="padding: 0; min-height: 36px; color: #DDF58B" onClick="{{nextTip}}">Another tip</button></span>
    </div>
    <sc-if value="{{notChecked}}" hint-placeholder-val="{{ true }}">
    <button onClick="{{nav.checkin}}" style="appearance: none; cursor: pointer; font: inherit; text-align: left; border: 0; border-radius: 24px; background: transparent; color: #F5F5F2; box-shadow: inset 0 0 0 1.5px #2A2B30; padding: 14px 16px; display: flex; align-items: center; gap: 14px">
      <span style="flex: 1"><span style="display: block; font-weight: 600; font-size: 15px">How are you today?</span><span class="mut" style="display: block; font-size: 13px; margin-top: 2px">Four taps. Helps Spark learn what affects your energy.</span></span>
      <span style="font-size: 14px; font-weight: 600; color: #B7A6F6">Check in</span>
    </button>
    </sc-if>
    <button class="btn b-ghost full" style="margin-top: 4px" onClick="{{extraWorkout}}">Start a workout anyway</button>
  </div>
  </sc-if>

  <!-- ---------- Rested instead / done ---------- -->
  <sc-if value="{{todayAfter}}" hint-placeholder-val="{{ false }}">
  <div style="padding: 0 20px; margin-top: 30px; display: flex; flex-direction: column; gap: 14px">
    <div class="row" style="gap: 12px; align-items: flex-start; padding: 0 2px">
      <span class="av" style="width: 38px; height: 38px"><img src="img/logo.png" alt="" style="width: 23px; height: auto"></span>
      <span style="flex: 1; font-size: 16px; line-height: 1.45; padding-top: 2px">{{todayBubble}}</span>
    </div>
    <sc-if value="{{showRest}}" hint-placeholder-val="{{ false }}">
    <div class="card" style="display: flex; flex-direction: column; gap: 10px; background: #1C1D21">
      <h2 class="d" style="font-size: 26px">Rest day. Fully allowed.</h2>
      <p class="mut" style="margin: 0; font-size: 15px; line-height: 1.5">Nothing to make up tomorrow. If you fancy some air later, a 10-minute walk is ready.</p>
      <div class="row" style="gap: 10px; margin-top: 4px"><button class="btn b-lime sm" onClick="{{restWalk}}">Short walk instead</button><button class="btn b-ghost sm" onClick="{{undoRest}}">Undo</button></div>
    </div>
    </sc-if>
    <sc-if value="{{doneToday}}" hint-placeholder-val="{{ false }}">
    <div style="background: #DDF58B; color: #111214; border-radius: 30px; padding: 22px; display: flex; flex-direction: column; gap: 10px">
      <h2 class="d" style="font-size: 28px">You moved today.</h2>
      <p style="margin: 0; font-size: 15px; line-height: 1.5">That's banked, whichever version you did. Anything else is a bonus, never a requirement.</p>
      <button class="btn b-dark sm" style="align-self: flex-start" onClick="{{noteHowItWent}}">Note how it went</button>
    </div>
    </sc-if>
  </div>
  </sc-if>
</div>
</sc-if>

<!-- ================= ENVIRONMENT CHECK + ADAPTED PLAN ================= -->
<sc-if value="{{is.env}}" hint-placeholder-val="{{ false }}">
<div class="scroll" style="padding: 24px 22px 36px; display: flex; flex-direction: column">
  <div class="row" style="justify-content: space-between">
    <button class="ib" aria-label="Back" onClick="{{env.back}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
    <sc-if value="{{env.isQ}}" hint-placeholder-val="{{ true }}"><div class="row" style="gap: 6px; width: 150px" aria-label="Question {{env.pos}} of {{env.count}}"><sc-for list="{{env.dots}}" as="b" hint-placeholder-count="4"><span class="seg" style="{{b.st}}"></span></sc-for></div></sc-if>
    <sc-if value="{{env.isPlan}}" hint-placeholder-val="{{ false }}"><span style="font-size: 15px; font-weight: 600">Your coach</span></sc-if>
    <sc-if value="{{env.isQ}}" hint-placeholder-val="{{ true }}"><button class="link" onClick="{{env.skip}}">Skip</button></sc-if>
    <sc-if value="{{env.isPlan}}" hint-placeholder-val="{{ false }}"><span style="width: 44px"></span></sc-if>
  </div>

  <sc-if value="{{env.isQ}}" hint-placeholder-val="{{ true }}">
    <sc-if value="{{env.coachLine}}" hint-placeholder-val="{{ true }}">
    <div class="row" style="gap: 10px; margin-top: 36px; align-items: flex-start">
      <span class="av" style="width: 34px; height: 34px"><img src="img/logo.png" alt="" style="width: 20px; height: auto"></span>
      <span style="flex: 1; font-size: 15px; line-height: 1.45; color: #B7A6F6; font-weight: 500; padding-top: 6px">{{env.coach}}</span>
    </div>
    </sc-if>
    <sc-if value="{{env.coachBox}}" hint-placeholder-val="{{ false }}">
    <section class="rise" aria-label="Spark AI Coach" style="margin-top: 28px; background: #1C1D21; border-radius: 26px; padding: 18px; box-shadow: inset 0 0 0 1.5px #B7A6F6; display: flex; flex-direction: column; gap: 12px">
      <div class="row" style="gap: 12px">
        <span class="av"><img src="img/logo.png" alt="" style="width: 26px; height: auto"></span>
        <span style="flex: 1"><span style="display: block; font-size: 14px; font-weight: 600; color: #B7A6F6">Spark AI Coach</span><span class="mut" style="display: block; font-size: 13px">Working out an alternative plan</span></span>
      </div>
      <p style="margin: 0; font-size: 17px; line-height: 1.45">{{env.coach}}</p>
    </section>
    </sc-if>
    <h1 class="d" style="font-size: 38px; margin-top: 22px">{{env.q}}</h1>
    <sc-if value="{{env.isWhere}}" hint-placeholder-val="{{ true }}">
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 28px">
      <sc-for list="{{env.where}}" as="o" hint-placeholder-count="4">
        <button aria-pressed="{{o.on}}" onClick="{{o.pick}}" style="appearance: none; cursor: pointer; font: inherit; border: 0; border-radius: 26px; padding: 18px 16px; min-height: 150px; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; text-align: left; position: relative; {{o.st}}">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{o.ic}}"></path></svg>
          <sc-if value="{{o.usual}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; top: 16px; right: 14px; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: #26272C; color: #D4D4D8">Usual</span></sc-if>
          <span style="font-weight: 600; font-size: 18px">{{o.label}}</span>
        </button>
      </sc-for>
    </div>
    </sc-if>
    <sc-if value="{{env.isList}}" hint-placeholder-val="{{ false }}">
    <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 28px">
      <sc-for list="{{env.opts}}" as="o" hint-placeholder-count="3">
        <button class="ropt {{o.cls}}" aria-pressed="{{o.on}}" onClick="{{o.pick}}" style="min-height: 84px; max-height: none; padding: 14px 20px">
          <span style="flex: 1; text-align: left"><span style="display: block">{{o.label}}</span><sc-if value="{{o.hasSub}}" hint-placeholder-val="{{ true }}"><span style="display: block; font-size: 14px; font-weight: 500; opacity: .7; margin-top: 2px">{{o.sub}}</span></sc-if></span>
          <sc-if value="{{o.hasSegs}}" hint-placeholder-val="{{ true }}"><span class="hmeter" aria-hidden="true"><sc-for list="{{o.segs}}" as="s" hint-placeholder-count="3"><i class="{{s.c}}"></i></sc-for></span></sc-if>
          <sc-if value="{{o.hasIc}}" hint-placeholder-val="{{ false }}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; opacity: .8"><path d="{{o.ic}}"></path></svg></sc-if>
        </button>
      </sc-for>
    </div>
    </sc-if>
    <div style="flex: 1; min-height: 20px"></div>
    <p class="mut" style="text-align: center; margin: 20px 0 0; font-size: 14px">Tap one and it moves on by itself.</p>
  </sc-if>

  <sc-if value="{{env.isPlan}}" hint-placeholder-val="{{ false }}">
    <section class="rise" aria-label="Spark AI Coach" style="margin-top: 26px; background: #1C1D21; border-radius: 26px; padding: 18px; box-shadow: inset 0 0 0 1.5px #B7A6F6; display: flex; flex-direction: column; gap: 12px">
      <div class="row" style="gap: 12px">
        <span class="av"><img src="img/logo.png" alt="" style="width: 26px; height: auto"></span>
        <span style="flex: 1"><span style="display: block; font-size: 14px; font-weight: 600; color: #B7A6F6">Spark AI Coach</span><span class="mut" style="display: block; font-size: 13px">{{ep.coachSub}}</span></span>
      </div>
      <p style="margin: 0; font-size: 18px; line-height: 1.45">{{ep.coach}}</p>
      <sc-if value="{{ep.hasTips}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-direction: column; gap: 8px; padding-top: 4px; border-top: 1px solid #2A2B30">
        <sc-for list="{{ep.tips}}" as="t" hint-placeholder-count="2">
          <div class="row" style="gap: 10px; align-items: flex-start; padding-top: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#DDF58B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 3px"><path d="M5 12l5 5 9-10"></path></svg><span class="mut" style="font-size: 15px; line-height: 1.4; color: #D4D4D8">{{t.text}}</span></div>
        </sc-for>
      </div>
      </sc-if>
    </section>

    <sc-if value="{{ep.isGo}}" hint-placeholder-val="{{ false }}">
      <div style="flex: 1; min-height: 40px"></div>
      <button class="btn b-lime full go-btn" style="min-height: 80px; font-size: 20px; justify-content: flex-start; padding: 0 10px; gap: 16px" onClick="{{ep.goUsual}}">
        <span style="width: 60px; height: 60px; flex: none; border-radius: 50%; background: #111214; color: #DDF58B; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z" fill="currentColor"></path></svg></span>
        <span class="d" style="font-size: 22px">Start my workout</span>
      </button>
      <button class="link" style="align-self: center; margin-top: 8px" onClick="{{ep.showLadder}}">I'd rather take it easier today</button>
    </sc-if>

    <sc-if value="{{ep.ladderOn}}" hint-placeholder-val="{{ true }}">
      <h2 class="d" style="font-size: 20px; margin-top: 26px">Pick what feels doable</h2>
      <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 12px">
        <sc-for list="{{ep.ladder}}" as="o" hint-placeholder-count="3">
          <button onClick="{{o.pick}}" style="appearance: none; cursor: pointer; font: inherit; text-align: left; border: 0; border-radius: 24px; padding: 16px 18px; display: flex; align-items: center; gap: 14px; {{o.st}}">
            <span style="flex: 1; min-width: 0">
              <sc-if value="{{o.rec}}" hint-placeholder-val="{{ false }}"><span style="display: inline-block; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: #111214; color: #DDF58B; margin-bottom: 8px">Spark suggests</span></sc-if>
              <span style="display: block; font-weight: 600; font-size: 17px">{{o.title}}</span>
              <span style="display: block; font-size: 14px; line-height: 1.4; margin-top: 3px; opacity: .75">{{o.sub}}</span>
            </span>
            <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="flex: none"><path d="M8 5.5v13l11-6.5z" fill="currentColor"></path></svg>
          </button>
        </sc-for>
      </div>
    </sc-if>

    <div class="row" style="justify-content: center; margin-top: 10px">
      <sc-if value="{{ep.showCalm}}" hint-placeholder-val="{{ false }}"><button class="link" onClick="{{ep.calm}}">I need a minute first</button></sc-if>
    </div>
    <p class="mut" style="text-align: center; margin: 6px 0 0; font-size: 14px">Whatever you do today counts.</p>
  </sc-if>
</div>
</sc-if>

<!-- ================= CHECK-IN ================= -->
<sc-if value="{{is.checkin}}" hint-placeholder-val="{{ false }}">
<div class="scroll" style="padding: 24px 22px 36px; display: flex; flex-direction: column">
  <div class="row" style="justify-content: space-between">
    <button class="ib" aria-label="{{checkBackLabel}}" onClick="{{checkBack}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
    <div class="row" style="gap: 6px; width: 150px" aria-label="Question {{checkPos}} of 4"><sc-for list="{{checkDots}}" as="b" hint-placeholder-count="4"><span class="seg" style="{{b.st}}"></span></sc-for></div>
    <button class="link" onClick="{{checkSkip}}">Skip</button>
  </div>
  <p class="mut" style="margin: 40px 0 0; font-size: 15px">{{checkQ.aside}}</p>
  <h1 class="d" style="font-size: 44px; margin-top: 10px">{{checkQ.q}}</h1>
  <div style="flex: 1; display: flex; flex-direction: column; gap: 10px; margin-top: 28px">
    <sc-for list="{{checkQ.opts}}" as="o" hint-placeholder-count="5">
      <button class="ropt {{o.cls}}" aria-pressed="{{o.on}}" onClick="{{o.pick}}">
        <span style="flex: 1; text-align: left">{{o.label}}</span>
        <span class="hmeter" aria-hidden="true"><sc-for list="{{o.segs}}" as="s" hint-placeholder-count="5"><i class="{{s.c}}"></i></sc-for></span>
      </button>
    </sc-for>
  </div>
  <p class="mut" style="text-align: center; margin: 20px 0 0; font-size: 14px">Tap one and it moves on by itself.</p>
</div>
</sc-if>

<!-- ================= ROUTINE ================= -->
<sc-if value="{{is.routine}}" hint-placeholder-val="{{ false }}">
<div class="scroll" style="padding: 24px 20px 124px">
  <h1 class="d" style="font-size: 34px">Your week</h1>
  <p class="mut" style="margin: 8px 0 20px; font-size: 15px; line-height: 1.5">A loose shape, not a contract. Tap a day to change it.</p>
  <div style="display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{routineRows}}" as="r" hint-placeholder-count="7">
      <button onClick="{{r.cycle}}" aria-label="{{r.aria}}" style="appearance: none; cursor: pointer; font: inherit; width: 100%; border: 0; border-radius: 24px; padding: 14px 16px; display: flex; align-items: center; gap: 14px; text-align: left; min-height: 72px; {{r.st}}">
        <span style="width: 46px; text-align: center; flex: none"><span style="display: block; font-size: 12px; opacity: .7">{{r.d}}</span><span class="d" style="display: block; font-size: 22px">{{r.n}}</span></span>
        <span style="flex: 1"><span style="display: block; font-weight: 600; font-size: 16px">{{r.title}}</span><span style="font-size: 14px; opacity: .7">{{r.sub}}</span></span>
        <sc-if value="{{r.moved}}" hint-placeholder-val="{{ false }}"><span style="width: 30px; height: 30px; border-radius: 50%; background: #111214; color: #DDF58B; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-label="Done" role="img"><path d="M5 12l5 5 9-10"></path></svg></span></sc-if>
      </button>
    </sc-for>
  </div>
  <sc-if value="{{tomorrowPlanned}}" hint-placeholder-val="{{ false }}"><div class="toast" style="margin-top: 14px">Monday, 07:30: 15-⁠minute session added</div></sc-if>
  <div class="card" style="margin-top: 20px; display: flex; flex-direction: column; gap: 18px">
    <div class="row"><span style="flex: 1"><span style="display: block; font-weight: 600">Missed one? Let it slide</span><span class="mut" style="font-size: 14px">Moves to your next free day. Never piles up.</span></span><button class="tg {{slideCls}}" aria-pressed="{{slide}}" aria-label="Let missed sessions slide" onClick="{{toggleSlide}}"></button></div>
    <div class="row"><span style="flex: 1"><span style="display: block; font-weight: 600">One gentle reminder</span><span class="mut" style="font-size: 14px">30 minutes before. Never more than one.</span></span><button class="tg {{remCls}}" aria-pressed="{{reminders}}" aria-label="One gentle reminder" onClick="{{toggleRem}}"></button></div>
  </div>
</div>
</sc-if>

<!-- ================= PREP ================= -->
<sc-if value="{{is.prep}}" hint-placeholder-val="{{ false }}">
<div class="scroll" style="padding: 0 0 36px">
  <div class="ph" style="height: 330px; padding: 22px 20px; display: flex; flex-direction: column">
    <span class="phtag" style="top: auto; bottom: 60px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="3"></rect><circle cx="12" cy="13" r="3.5"></circle></svg>Workout photo</span>
    <span class="shade"></span>
    <div class="row" style="justify-content: space-between; position: relative">
      <button class="ib" aria-label="Back" onClick="{{goBack}}" style="background: rgba(17,18,20,.5)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
    </div>
    <div style="flex: 1"></div>
    <h1 class="d" style="font-size: 40px; position: relative">{{plan.title}}</h1>
    <p style="margin: 8px 0 0; font-size: 15px; position: relative; color: #E4E4E7">{{plan.mins}} mins, {{planMoves}}</p>
  </div>
  <div style="padding: 0 20px">
    <sc-if value="{{prepIsWorkout}}" hint-placeholder-val="{{ true }}">
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 20px" role="group" aria-label="Session length">
      <sc-for list="{{planOpts}}" as="o" hint-placeholder-count="4"><button class="chip {{o.cls}}" aria-pressed="{{o.on}}" onClick="{{o.pick}}" style="justify-content: center">{{o.label}}</button></sc-for>
    </div>
    </sc-if>
    <sc-if value="{{prepGymTip}}" hint-placeholder-val="{{ true }}">
    <div class="coach" style="margin-top: 16px">
      <span class="av" style="width: 36px; height: 36px"><img src="img/logo.png" alt="" style="width: 22px; height: auto"></span>
      <span style="font-size: 15px; line-height: 1.45">It's usually quieter before 5pm. If a machine's taken mid-⁠session, tap <b style="color: #B7A6F6">Adapt</b> and I'll find a swap.</span>
    </div>
    </sc-if>
    <div class="row" style="justify-content: space-between; margin-top: 24px"><h3 class="d" style="font-size: 20px">Exercises</h3><span class="mut" style="font-size: 14px">{{prepSetsLabel}}</span></div>
    <div style="margin-top: 6px">
      <sc-for list="{{prepList}}" as="e" hint-placeholder-count="4">
        <div class="line">
          <span class="{{e.ph}}" style="width: 56px; height: 56px; border-radius: 16px; flex: none"></span>
          <span style="flex: 1"><span style="display: block; font-weight: 600; font-size: 16px">{{e.name}}</span><span class="mut" style="font-size: 14px">{{e.detail}}</span></span>
        </div>
      </sc-for>
    </div>
    <button class="btn b-lime full" style="margin-top: 22px; min-height: 60px; font-size: 17px" onClick="{{startSession}}">{{prepStartLabel}}</button>
    <p class="mut" style="text-align: center; font-size: 14px; margin: 12px 0 0">{{prepFoot}}</p>
  </div>
</div>
</sc-if>

<!-- ================= ACTIVE WORKOUT ================= -->
<sc-if value="{{is.active}}" hint-placeholder-val="{{ false }}">
<div class="scroll ws {{wsCls}}" style="background: {{wsBg}}; transition: background .5s ease">
  <div style="position: relative; padding: 20px 18px 28px; min-height: 100%; display: flex; flex-direction: column; color: {{wsInk}}">

    <!-- top bar -->
    <div class="row" style="gap: 12px">
      <button class="ib ws-ib" aria-label="Pause" onClick="{{pause}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.5"></rect><rect x="14" y="5" width="4" height="14" rx="1.5"></rect></svg></button>
      <span style="flex: 1; min-width: 0">
        <span class="row" style="justify-content: space-between; gap: 8px"><span class="ws-mut" style="font-size: 13px; font-weight: 600">Exercise {{act.pos}} of {{act.count}}</span><sc-if value="{{quiet}}" hint-placeholder-val="{{ false }}"><button class="ws-mut" onClick="{{quietOff}}" style="appearance: none; border: 0; background: none; cursor: pointer; font: inherit; font-size: 12px; font-weight: 600; padding: 0">Quiet mode · Turn off</button></sc-if></span>
        <span class="row {{barsCls}}" style="gap: 5px; margin-top: 8px"><sc-for list="{{act.bars}}" as="b" hint-placeholder-count="4"><span class="seg {{b.cls}}" style="height: 6px"></span></sc-for></span>
      </span>
      <button class="ws-end" onClick="{{finish}}">End</button>
    </div>

    <sc-if value="{{hasToast}}" hint-placeholder-val="{{ false }}"><div class="toast rise" style="margin-top: 14px; background: #DDF58B; color: #111214"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>{{toast}}</div></sc-if>
    <sc-if value="{{hasPbNow}}" hint-placeholder-val="{{ false }}">
    <div class="rise" style="margin-top: 14px; background: #DDF58B; color: #111214; border-radius: 22px; padding: 14px 16px; display: flex; gap: 14px; align-items: center">
      <span style="width: 44px; height: 44px; border-radius: 50%; background: #111214; color: #DDF58B; display: flex; align-items: center; justify-content: center; flex: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4h8v5a4 4 0 0 1-8 0zM8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8 20h8"></path></svg></span>
      <span style="flex: 1"><span style="display: block; font-weight: 700; font-size: 16px">New personal best</span><span style="font-size: 14px">{{pbNow.kg}} {{pbNow.unit}}, up from {{pbNow.prev}}. Saved.</span></span>
    </div>
    </sc-if>

    <!-- ===== SET STAGE ===== -->
    <sc-if value="{{notResting}}" hint-placeholder-val="{{ true }}">
    <section class="rise" style="position: relative; overflow: hidden; isolation: isolate; margin-top: 16px; border-radius: 32px; padding: 22px 20px 20px; background: radial-gradient(120% 90% at 85% 0%, rgba(183,166,246,.42), rgba(183,166,246,0) 55%), radial-gradient(90% 80% at 0% 100%, rgba(221,245,139,.20), rgba(221,245,139,0) 60%), #1C1D21">
      <svg class="rings" viewBox="0 0 200 200" width="280" height="280" aria-hidden="true" style="right: -110px; top: -110px; z-index: -1"><g fill="none" stroke="#F5F5F2" stroke-opacity=".06" stroke-width="10"><circle cx="100" cy="100" r="30"></circle><circle cx="100" cy="100" r="55"></circle><circle cx="100" cy="100" r="80"></circle></g></svg>
      <div class="row" style="justify-content: space-between; align-items: flex-start; gap: 10px">
        <span class="tag" style="background: rgba(17,18,20,.55); color: #D4D4D8">{{act.ex.areaText}}</span>
        <button onClick="{{toggleCues}}" aria-expanded="{{showCues}}" style="appearance: none; cursor: pointer; font: inherit; border: 0; height: 32px; padding: 0 12px; border-radius: 999px; background: rgba(245,245,242,.1); color: #F5F5F2; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; flex: none"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 9a3 3 0 1 1 4 2.8c-.7.3-1 1-1 1.7V15M12 18.5v.5"></path></svg>{{cuesLabel}}</button>
      </div>
      <h1 class="d" style="font-size: 34px; margin-top: 16px">{{act.ex.name}}</h1>
      <sc-if value="{{showCues}}" hint-placeholder-val="{{ false }}">
      <div style="margin-top: 14px; display: flex; flex-direction: column; gap: 10px">
        <sc-for list="{{act.cues}}" as="c" hint-placeholder-count="3"><div class="row" style="gap: 12px; align-items: flex-start"><span style="width: 26px; height: 26px; flex: none; border-radius: 50%; background: #DDF58B; color: #111214; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{c.n}}</span><span style="font-size: 15px; line-height: 1.4; padding-top: 3px">{{c.t}}</span></div></sc-for>
      </div>
      </sc-if>
      <sc-if value="{{act.showPills}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; gap: 8px; margin-top: 20px" role="list" aria-label="{{act.setLine}}">
        <sc-for list="{{act.setPills}}" as="p" hint-placeholder-count="3">
          <span role="listitem" style="flex: 1; height: 46px; border-radius: 999px; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px; font-weight: 700; {{p.st}}"><sc-if value="{{p.done}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></sc-if>{{p.label}}</span>
        </sc-for>
      </div>
      </sc-if>
    </section>

    <sc-if value="{{act.prog.on}}" hint-placeholder-val="{{ true }}">
    <section class="rise" aria-label="Spark AI Coach" style="margin-top: 12px; background: #1C1D21; border-radius: 26px; padding: 16px; box-shadow: inset 0 0 0 1.5px #B7A6F6; display: flex; flex-direction: column; gap: 12px">
      <div class="row" style="gap: 10px">
        <span class="av" style="width: 34px; height: 34px"><img src="img/logo.png" alt="" style="width: 20px; height: auto"></span>
        <span style="flex: 1"><span style="display: block; font-size: 13px; font-weight: 600; color: #B7A6F6">Spark AI Coach</span><span class="mut" style="display: block; font-size: 12px">{{act.prog.when}}</span></span>
      </div>
      <p style="margin: 0; font-size: 16px; line-height: 1.45">{{act.prog.text}}</p>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <button class="btn sm" style="{{act.prog.aSt}}" onClick="{{act.prog.a}}">{{act.prog.aLabel}}</button>
        <button class="btn sm" style="{{act.prog.bSt}}" onClick="{{act.prog.b}}">{{act.prog.bLabel}}</button>
      </div>
    </section>
    </sc-if>

    <div style="flex: 1; min-height: 12px; display: flex; align-items: center; justify-content: center">
      <sc-if value="{{act.showRing}}" hint-placeholder-val="{{ false }}">
      <div class="rise" style="display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px 0">
        <div style="position: relative; width: 196px; height: 196px">
          <svg width="196" height="196" viewBox="0 0 200 200" role="img" aria-label="{{act.setLine}}" style="position: absolute; inset: 0">
            <circle cx="100" cy="100" r="96" fill="none" stroke="#DDF58B" stroke-opacity=".06" stroke-width="2"></circle>
            <circle cx="100" cy="100" r="80" fill="none" stroke="#1C1D21" stroke-width="14"></circle>
            <circle cx="100" cy="100" r="80" fill="none" stroke="#DDF58B" stroke-width="14" stroke-linecap="round" stroke-dasharray="{{act.ringDash}}" transform="rotate(-90 100 100)"></circle>
          </svg>
          <span style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center">
            <span class="ws-mut" style="font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase">Set</span>
            <span class="n9" style="font-size: 64px; line-height: 1">{{act.setNow}}</span>
            <span class="ws-mut" style="font-size: 14px; font-weight: 600">of {{act.setOf}}</span>
          </span>
        </div>
        <span class="ws-mut" style="font-size: 14px; font-weight: 500">{{act.lastLine}}</span>
      </div>
      </sc-if>
    </div>
    <div style="display: grid; grid-template-columns: {{act.gridCols}}; gap: 10px">
      <sc-if value="{{act.hasKg}}" hint-placeholder-val="{{ true }}">
      <div class="numtile">
        <span class="ws-mut" style="font-size: 13px; font-weight: 600">Weight</span>
        <span style="white-space: nowrap"><span class="n9" style="font-size: 52px">{{act.kg}}</span><span class="ws-mut" style="font-size: 14px; font-weight: 600; margin-left: 4px">{{act.unit}}</span></span>
        <span class="row" style="gap: 8px"><button class="numbtn" aria-label="Less weight" onClick="{{kgDown}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button><button class="numbtn" aria-label="More weight" onClick="{{kgUp}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button></span>
      </div>
      </sc-if>
      <div class="numtile">
        <span class="ws-mut" style="font-size: 13px; font-weight: 600">{{act.repTitle}}</span>
        <span style="white-space: nowrap"><span class="n9" style="font-size: 52px">{{act.reps}}</span><span class="ws-mut" style="font-size: 14px; font-weight: 600; margin-left: 4px">{{act.repUnit}}</span></span>
        <span class="row" style="gap: 8px"><button class="numbtn" aria-label="Fewer" onClick="{{repDown}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button><button class="numbtn" aria-label="More" onClick="{{repUp}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button></span>
      </div>
    </div>
    </sc-if>

    <!-- ===== REST STAGE ===== -->
    <sc-if value="{{rest.on}}" hint-placeholder-val="{{ false }}">
    <div class="rise" style="position: relative; isolation: isolate; margin-top: 22px; display: flex; flex-direction: column; align-items: center; text-align: center">
      <svg viewBox="0 0 200 200" width="520" height="520" aria-hidden="true" style="position: absolute; left: 50%; top: 155px; transform: translate(-50%, -50%); z-index: -1; pointer-events: none"><g fill="none" stroke="#A6D8FA" stroke-width="7"><circle class="rest-wave" cx="100" cy="100" r="50" stroke-opacity=".16"></circle><circle cx="100" cy="100" r="70" stroke-opacity=".09"></circle><circle cx="100" cy="100" r="90" stroke-opacity=".05"></circle></g></svg>
      <span style="display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 14px; border-radius: 999px; background: #A6D8FA; color: #0C1822; font-size: 13px; font-weight: 600"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>Set logged</span>
      <div style="position: relative; width: 210px; height: 210px; margin-top: 18px">
        <svg width="210" height="210" viewBox="0 0 76 76" role="img" aria-label="Rest time left {{rest.left}}" style="position: absolute; inset: 0">
          <circle cx="38" cy="38" r="34" fill="#A6D8FA" fill-opacity=".06" stroke="rgba(166,216,250,.16)" stroke-width="4"></circle>
          <circle cx="38" cy="38" r="34" fill="none" stroke="#A6D8FA" stroke-width="4" stroke-linecap="round" stroke-dasharray="{{rest.ring}}" transform="rotate(-90 38 38)"></circle>
        </svg>
        <span style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center">
          <span style="font-size: 14px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: #A6D8FA">{{rest.title}}</span>
          <span class="n9" style="font-size: 64px; margin-top: 4px">{{rest.left}}</span>
        </span>
      </div>
      <div class="row" style="gap: 8px; margin-top: 16px">
        <button class="restpill" onClick="{{addRest}}">+15 sec</button>
        <button class="restpill" onClick="{{skipRest}}">Skip rest</button>
      </div>
      <div style="align-self: stretch; margin-top: 16px; background: rgba(166,216,250,.07); box-shadow: inset 0 0 0 1.5px rgba(166,216,250,.18); color: #F5F5F2; border-radius: 24px; padding: 14px 16px; display: flex; align-items: center; gap: 14px; text-align: left">
        <span style="width: 42px; height: 42px; flex: none; border-radius: 50%; background: #A6D8FA; color: #111214; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span>
        <span style="flex: 1; min-width: 0"><span style="display: block; font-size: 12px; font-weight: 600; color: #A6D8FA">{{rest.nextLabel}}</span><span style="display: block; font-size: 16px; font-weight: 600; margin-top: 2px">{{act.nextTitle}}</span><span style="display: block; font-size: 13px; margin-top: 2px; color: #9FB7C9">{{act.nextSub}}</span></span>
      </div>
    </div>

    <div style="margin-top: 12px; display: flex; flex-direction: column; gap: 12px">
      <sc-if value="{{rest.water}}" hint-placeholder-val="{{ false }}">
      <div style="background: rgba(166,216,250,.07); color: #F5F5F2; border-radius: 22px; padding: 12px 14px; display: flex; align-items: center; gap: 12px">
        <span style="width: 40px; height: 40px; flex: none; border-radius: 50%; background: #A6D8FA; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111214" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c3 4 6 7.5 6 11a6 6 0 0 1-12 0c0-3.5 3-7 6-11z"></path></svg></span>
        <span style="flex: 1; font-size: 15px; font-weight: 600">Have a sip of water?</span>
        <button class="btn b-sky sm" style="min-height: 40px; padding: 0 14px" onClick="{{drankWater}}">Done</button>
        <button class="link" style="color: #9FB7C9; min-height: 40px" onClick="{{skipWater}}">Later</button>
      </div>
      </sc-if>

      <sc-if value="{{rest.showStim}}" hint-placeholder-val="{{ true }}">
      <div style="background: rgba(166,216,250,.06); border-radius: 28px; padding: 14px; display: flex; flex-direction: column; gap: 12px">
      <span style="font-size: 13px; font-weight: 600; text-align: center; color: #9FB7C9">Something for your hands while you wait</span>
      <div style="display: flex; background: rgba(255,255,255,.06); border-radius: 999px; padding: 4px; gap: 4px" role="group" aria-label="Rest tools">

              <circle cx="100" cy="34" r="6" fill="none" stroke="#000000" stroke-opacity=".35" stroke-width="1.2"></circle>
              <circle cx="157" cy="133" r="26" fill="url(#spLav)"></circle>

              <circle cx="157" cy="133" r="21.5" fill="none" stroke="#FFFFFF" stroke-opacity=".15" stroke-width="1.2"></circle>
              <circle cx="157" cy="133" r="13" fill="url(#spBearing)"></circle>
              <circle cx="157" cy="133" r="8.5" fill="#1F2024"></circle>
              <circle cx="157" cy="133" r="6" fill="none" stroke="#000000" stroke-opacity=".35" stroke-width="1.2"></circle>

</sc-if>
</sc-if>

<!-- ================= ADAPT + SWAP ================= -->
<sc-if value="{{is.adapt}}" hint-placeholder-val="{{ false }}">
<div class="scroll" style="padding: 24px 20px 36px">
  <div class="row" style="justify-content: space-between">
    <button class="ib" aria-label="Back to workout" onClick="{{nav.active}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
    <span style="font-weight: 600">Adapt your workout</span>
    <span style="width: 44px"></span>
  </div>

  <sc-if value="{{adapt.picking}}" hint-placeholder-val="{{ true }}">
    <h1 class="d" style="font-size: 36px; margin-top: 28px">What's going on?</h1>
    <p class="mut" style="margin: 8px 0 22px; font-size: 16px">One tap. We'll sort it together.</p>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <sc-for list="{{issues}}" as="i" hint-placeholder-count="6">
        <button class="itile" onClick="{{i.pick}}" style="{{i.st}}">
          <span style="width: 40px; height: 40px; border-radius: 50%; background: rgba(17,18,20,.1); display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111214" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{i.icon}}"></path></svg></span>
          <span>{{i.label}}</span>
        </button>
      </sc-for>
    </div>
    <button onClick="{{goCalm}}" style="appearance: none; cursor: pointer; font: inherit; width: 100%; margin-top: 10px; background: #1C1D21; color: #F5F5F2; border: 0; border-radius: 24px; padding: 18px; display: flex; align-items: center; gap: 14px; text-align: left">
      <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="17" fill="none" stroke="#B7A6F6" stroke-width="3"></circle><circle cx="20" cy="20" r="8" fill="#B7A6F6"></circle></svg>
      <span style="flex: 1"><span style="display: block; font-weight: 600; font-size: 17px">I'm overwhelmed</span><span class="mut" style="font-size: 14px">Take me somewhere quiet first</span></span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A1A1AA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
    </button>
    <p class="mut" style="font-size: 13px; line-height: 1.5; margin: 18px 4px 0">Whatever you pick, it still counts as today's workout.</p>
  </sc-if>

  <sc-if value="{{adapt.talking}}" hint-placeholder-val="{{ false }}">
    <div style="display: flex; flex-direction: column; gap: 14px; margin-top: 28px">
      <div class="mine rise">{{adapt.issueLabel}}</div>
      <div class="row rise" style="align-items: flex-end; gap: 10px">
        <span class="av" style="width: 36px; height: 36px"><img src="img/logo.png" alt="Spark" style="width: 22px; height: auto"></span>
        <div class="bub" style="flex: 1">{{adapt.msg}}</div>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 24px">
      <sc-for list="{{adapt.opts}}" as="o" hint-placeholder-count="2"><button class="btn {{o.cls}} full" onClick="{{o.act}}">{{o.label}}</button></sc-for>
    </div>
    <button class="link" style="display: flex; margin: 10px auto 0" onClick="{{adaptReset}}">Something else is going on</button>
  </sc-if>

  <sc-if value="{{adapt.swapping}}" hint-placeholder-val="{{ false }}">
    <div class="row" style="align-items: flex-end; gap: 10px; margin-top: 24px">
      <span class="av" style="width: 36px; height: 36px"><img src="img/logo.png" alt="Spark" style="width: 22px; height: auto"></span>
      <div class="bub" style="flex: 1">{{adapt.swapMsg}}</div>
    </div>
    <div class="rise" style="margin-top: 18px; background: #B7A6F6; color: #111214; border-radius: 30px; overflow: hidden">
      <div class="ph2" style="height: 170px; display: flex; align-items: center; justify-content: center">
        <span class="phtag"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="3"></rect><circle cx="12" cy="13" r="3.5"></circle></svg>Demo clip</span>
        <button class="ib ib-light" aria-label="Play demo" style="width: 58px; height: 58px; position: relative"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg></button>
      </div>
      <div style="padding: 18px 20px 8px; position: relative">
        <span style="position: absolute; right: 18px; top: -34px; width: 68px; height: 68px; border-radius: 50%; background: #F5F5F2; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 0 0 5px #B7A6F6"><span class="n9" style="font-size: 18px">{{adapt.doseShort}}</span><span style="font-size: 11px">{{adapt.doseUnit}}</span></span>
        <p style="margin: 0; font-size: 14px; font-weight: 500">{{adapt.kicker}}</p>
        <h2 class="d" style="font-size: 28px; margin-top: 4px; padding-right: 70px">{{adapt.ex.name}}</h2>
        <p style="margin: 6px 0 0; font-size: 14px">{{adapt.dose}}</p>
        <div style="margin-top: 10px"><sc-for list="{{adapt.cues}}" as="c" hint-placeholder-count="3"><div class="lline" style="border-color: rgba(17,18,20,.12)"><span class="num">{{c.n}}</span><span style="font-size: 15px; line-height: 1.4">{{c.t}}</span></div></sc-for></div>
      </div>
    </div>
    <button class="btn b-lime full" style="margin-top: 18px; min-height: 60px; font-size: 17px" onClick="{{backToWorkout}}">Continue workout</button>
    <sc-if value="{{adapt.canRetry}}" hint-placeholder-val="{{ true }}"><button class="link" style="display: flex; margin: 8px auto 0" onClick="{{adaptRetry}}">That's not free either</button></sc-if>
  </sc-if>
</div>
</sc-if>

<!-- ================= CALM MODE ================= -->
<sc-if value="{{is.calm}}" hint-placeholder-val="{{ false }}">
<div class="scroll" style="background: #0B0B0D; padding: 30px 26px 36px; display: flex; flex-direction: column; align-items: center; text-align: center">

  <p class="mut" style="margin: 12px 0 0; font-size: 16px; line-height: 1.5">Nothing to decide yet. Just breathe with the circle.</p>

  </div>
  <div style="flex: 1; min-height: 30px"></div>
  <p class="mut" style="margin: 0 0 14px; font-size: 15px">{{calmNote}}</p>
  <sc-if value="{{calmWorkout}}" hint-placeholder-val="{{ true }}">
  <button class="btn b-lav full" onClick="{{nav.active}}">Back to my workout</button>

  <button class="btn b-surf full" style="margin-top: 10px" onClick="{{finish}}">Finish for today</button>
  </sc-if>
  <sc-if value="{{calmOther}}" hint-placeholder-val="{{ false }}">
  <button class="btn b-lav full" onClick="{{calmLeave}}">{{calmLeaveLabel}}</button>
  </sc-if>
</div>
</sc-if>

<!-- ================= COMPLETE ================= -->
<sc-if value="{{is.complete}}" hint-placeholder-val="{{ false }}">
<div class="scroll" style="padding: 28px 20px 36px">

    <svg viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="{{done.sets}} sets logged">

      <circle cx="120" cy="120" r="100" fill="none" stroke="#DDF58B" stroke-width="22" stroke-linecap="round" stroke-dasharray="{{done.ringA}}" transform="rotate(-90 120 120)"></circle>
      <circle cx="120" cy="120" r="100" fill="none" stroke="#B7A6F6" stroke-width="22" stroke-linecap="round" stroke-dasharray="{{done.ringB}}" stroke-dashoffset="{{done.ringBOff}}" transform="rotate(-90 120 120)"></circle>

    </svg>
  </div>
  <h1 class="d" style="font-size: 34px; margin-top: 20px">{{done.title}}</h1>
  <p class="mut" style="margin: 8px 0 0; font-size: 16px; line-height: 1.5">{{done.msg}}</p>
  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 18px">
    <div style="background: #DDF58B; color: #111214; border-radius: 20px; padding: 14px"><span class="n9" style="font-size: 26px; display: block">{{done.sets}}</span><span style="font-size: 12px; font-weight: 500">Sets logged</span></div>
    <div style="background: #B7A6F6; color: #111214; border-radius: 20px; padding: 14px"><span class="n9" style="font-size: 26px; display: block">{{done.adapted}}</span><span style="font-size: 12px; font-weight: 500">Times adapted</span></div>
    <div style="background: #F5F5F2; color: #111214; border-radius: 20px; padding: 14px"><span class="n9" style="font-size: 26px; display: block">{{done.pbCount}}</span><span style="font-size: 12px; font-weight: 500">Personal bests</span></div>
  </div>
  <sc-for list="{{done.pbs}}" as="p" hint-placeholder-count="1">
    <div style="margin-top: 10px; background: #1C1D21; border-radius: 22px; padding: 14px 16px; display: flex; gap: 14px; align-items: center">
      <span style="width: 44px; height: 44px; border-radius: 50%; background: #DDF58B; color: #111214; display: flex; align-items: center; justify-content: center; flex: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4h8v5a4 4 0 0 1-8 0zM8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8 20h8"></path></svg></span>

    </div>
  </sc-for>

  <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px"><sc-for list="{{feelOpts}}" as="o" hint-placeholder-count="4"><button class="chip {{o.cls}}" aria-pressed="{{o.on}}" onClick="{{o.pick}}">{{o.label}}</button></sc-for></div>
  <label for="sp-note" class="mut" style="display: block; font-size: 14px; margin: 20px 0 8px">A note for your journal (optional)</label>

  <button class="btn b-lime full" style="margin-top: 18px" onClick="{{saveSession}}">Save to journal</button>
  <button class="link" style="display: flex; margin: 6px auto 0" onClick="{{skipSave}}">Done for now</button>
